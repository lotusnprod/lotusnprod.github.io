# ══════════════════════════════════════════════════════════════════════════
# HUGO BLOX CONFIGURATION
# Schema: hugoblox.com/schema/v2
# Tutorial: https://docs.hugoblox.com/tutorial/
# Documentation: https://docs.hugoblox.com/
# ══════════════════════════════════════════════════════════════════════════

hugoblox:
  schema: "2.0"

  identity:
    name: "The LOTUS Initiative"
    organization: "The LOTUS Initiative"
    type: organization
    tagline: "Open knowledge management for natural products research"
    description: "The LOTUS Initiative connects natural products research through open knowledge management, curated data, and reproducible workflows."

  theme:
    mode: system
    pack: "default"

  navigation:
    show_logo: false
    show_search: true
    show_mode_toggle: true

  footer:
    show_copyright: true
    show_backlinks: true

  reading_time: true
  comment: false
  sharing: true

  # Preserve the site-level metadata already in use by the existing content.
  seo:
    site_type: EducationalOrganization
    org_name: "The LOTUS Initiative"
