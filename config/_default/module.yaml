imports:
  - path: github.com/HugoBlox/kit/modules/integrations/netlify

  - path: github.com/HugoBlox/kit/modules/blox
    mounts:
      - source: content
        target: content
      - source: static
        target: static
      - source: layouts
        target: layouts
      - source: data
        target: data
      - source: assets
        target: assets
      - source: i18n
        target: i18n
      - source: archetypes
        target: archetypes

      # Server-rendered blocks, including content-collection.
      - source: blox
        target: layouts/_partials/hbx/blocks
        files:
          - "**/block.html"

      # Block client code and styles.
      - source: blox
        target: assets/js/hbx/blocks
        files:
          - "**/*.js"
          - "**/*.ts"
          - "**/*.jsx"
          - "**/*.tsx"
      - source: blox
        target: assets/css/hbx/blocks
        files:
          - "**/*.css"
      - source: blox/shared/js
        target: assets/js/hbx/shared
      - source: blox/shared/css
        target: assets/css/hbx/shared
      - source: blox
        target: assets/img/hbx/blocks
        files:
          - "**/*.png"
          - "**/*.jpg"
          - "**/*.jpeg"
          - "**/*.svg"
          - "**/*.webp"

  - path: github.com/HugoBlox/kit/modules/slides
